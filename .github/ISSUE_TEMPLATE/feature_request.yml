name: Feature Issue
description: Suggest a new feature for the project.
title: "[Feature]: "
labels: ["feature"]
projects: ["spe-uob/2025-F1AICommentary"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the following information regarding your issue.
  - type: textarea
    id: feature-details
    attributes:
      label: "Feature Details"
      description: "Describe the details of the feature you are adding."
      placeholder: "Feature details.."
    validations:
      required: true
  - type: textarea
    id: additional-information
    attributes:
      label: "Additional Information"
      description: "Describe any additional information required. "
      placeholder: "Additional information..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Submission Tasks"
      options:
        - label: "I have added a clear and concise description to the issue"
          required: true
        - label: "I have added all issue metadata, including: assignees, labels, priority, start date, milestone"
          required: true