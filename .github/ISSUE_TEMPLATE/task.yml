name: Task Assignment
description: Create and request a task
title: "[Task]: "
labels: task
type: task
projects: ["spe-uob/2025-F1AICommentary"]
body:
  - type: markdown
    attributes:
      value: "Please provide detail on the task you wish to create."  
  - type: textarea
    id: task-detail
    attributes:
      label: Task Details
      description: A clear and concise desc for the task.
      placeholder: e.g., Implement user authentication
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Submission Tasks"
      options:
        - label: "I have added a clear and concise description to the issue"
          required: true
        - label: "I have added all issue metadata, including: assignees, labels, priority, start date, milestone"
          required: true

