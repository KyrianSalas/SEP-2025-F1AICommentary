name: Bug Report
description: Report an unexpected bug or error.
title: "[Bug]: "
labels: bug
type: bug
projects: ["spe-uob/2025-F1AICommentary"]
body:
  - type: markdown
    attributes:
      value: "Please provide detail on the bug you are reporting."

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Submission Tasks"
      options:
        - label: "I have added a clear and concise description to the issue"
          required: true
        - label: "I have added all issue metadata, including: assignees, labels, priority, start date, milestone"
          required: true
        - label: "I have ensured that this is not a duplicate issue"