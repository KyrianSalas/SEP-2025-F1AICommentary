name: Deploy Backend

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/spe-uob/2025-f1aicommentary/backend:${{ github.ref_name }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure deploy directory exists
            mkdir -p ~/deploy
            # Create .env file from secret
            echo "${{ secrets.ENV_FILE }}" > ~/deploy/.env
            
            # Log in to registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop old container if it exists
            docker stop backend-${{ github.ref_name }} || true
            docker rm backend-${{ github.ref_name }} || true
            
            # Prune for space
            docker image prune -a -f
            docker builder prune -f

            # Pull new image
            docker rmi ghcr.io/spe-uob/2025-f1aicommentary/backend:${{ github.ref_name }} || true
            docker pull ghcr.io/spe-uob/2025-f1aicommentary/backend:${{ github.ref_name }}
            
            # Run new container
            docker run -d \
              --name backend-${{ github.ref_name }} \
              --restart always \
              -p ${{ github.ref_name == 'main' && '8000:8000' || '8001:8000' }} \
              --env-file ~/deploy/.env \
              ghcr.io/spe-uob/2025-f1aicommentary/backend:${{ github.ref_name }}